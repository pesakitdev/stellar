name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32v1-none
      - run: cargo check --target wasm32v1-none
        working-directory: contracts/bridge
        env:
          # soroban-sdk 28 refuses to build for wasm unless this marker is set. The Stellar CLI
          # sets it when it builds a contract; this check does not produce a wasm file.
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: "1"
