[workspace]
members = [
    "contracts/bridge",
]
resolver = "2"

# Profiles are only honoured at the workspace root.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
